# Temporary (removed before merge): regenerates the lockfile on a CI runner and
# captures before (main) / after (this branch) screenshots.
name: Temporary UI verification

on: pull_request

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: before
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Serve main
        working-directory: before
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm exec vite preview --port 4174 --strictPort > ../before-preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4174/svelte-ast-print-playground/
      - name: Before (main)
        run: pnpm exec playwright test --grep @shots
        env:
          BASE_URL: http://localhost:4174/svelte-ast-print-playground/
          SHOTS_DIR: shots/before
      - name: After (this branch)
        run: pnpm exec playwright test --grep @shots
        env:
          SHOTS_DIR: shots/after
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots
