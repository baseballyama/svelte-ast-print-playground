# Temporary, not for merge: regenerates pnpm-lock.yaml on a runner.
name: tmp-lock
on:
  push:
    branches: [build/types-node-26]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile && pnpm dedupe && git diff --stat -- pnpm-lock.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: lockfile
          path: pnpm-lock.yaml
